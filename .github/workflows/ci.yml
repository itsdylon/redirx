name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend --no-audit --no-fund
      - run: npm run test:run --prefix frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Production build and browser smoke
        run: npm run test:smoke --prefix frontend
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-failure
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore

  backend:
    name: Backend contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PREFLIGHT_TEST_DATABASE_URL: postgresql://postgres:fixture-only@127.0.0.1:5432/postgres
      PYTHON_DOTENV_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python scripts/ci/backend.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci --prefix mcp-auth-server --no-audit --no-fund
      - run: npm ci --prefix database/tests --no-audit --no-fund
      - name: Paid admission, concurrency and worker contracts
        run: CURRENT_BILLING_POSTGRES=1 CURRENT_BILLING_PYTHON=python QUOTE_PG_MODULE_ROOT="$GITHUB_WORKSPACE/mcp-auth-server/node_modules" node --test database/tests/current-billing.test.mjs

  services:
    name: MCP, OAuth and SQL
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            mcp-server/package-lock.json
            mcp-auth-server/package-lock.json
            database/tests/package-lock.json
      - run: npm ci --prefix mcp-server --no-audit --no-fund
      - run: npm ci --prefix mcp-auth-server --no-audit --no-fund
      - run: npm ci --prefix database/tests --no-audit --no-fund
      - run: node scripts/check_pivot_contract.mjs
      - run: npm run build --prefix mcp-server
      - run: npm test --prefix mcp-server
      - run: npm test --prefix mcp-auth-server
      - run: npm test --prefix database/tests
