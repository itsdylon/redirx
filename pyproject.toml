[project]
name = "redirx"
version = "0.1.0"
dependencies = [
  "aiohttp==3.14.3",
  "supabase>=2.24.0",
  "python-dotenv==1.0.0",
  "openai>=1.50.0,<2.0.0",
  "beautifulsoup4==4.12.3",
  "lxml>=5.3.0",
  "numpy==1.26.4",
  "websockets>=15.0",
  "Flask==3.1.2",
  "flask-cors==6.0.1",
  "flask-limiter>=3.8.0",
  "redis>=5.0.0",
  "PyJWT==2.10.1"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
